    <!-- Google Analytics + Google Ads + Meta Pixel con consentimiento. -->
    <script>
      (() => {
        const consentStorageKey = 'mpsj_cookie_consent';
        const googleAnalyticsId = 'G-1ZYHDJYQQN';
        const googleAdsTagId = 'AW-975990655';
        const phoneConversionId = 'AW-975990655/GPGlCNL12-IcEP_esdED';
        const metaPixelId = '2563290727469693';
        const googleTagScriptId = 'mpsj-google-tag';
        const metaPixelScriptId = 'mpsj-meta-pixel';
        let googleLibraryConfigured = false;
        let googleAnalyticsConfigured = false;
        let googleAdsConfigured = false;
        let metaPixelConfigured = false;

        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };

        window.gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
        });
        window.gtag('set', 'ads_data_redaction', true);

        const ensureGoogleTagLoaded = (bootstrapId) => {
          if (!document.getElementById(googleTagScriptId)) {
            const script = document.createElement('script');
            script.id = googleTagScriptId;
            script.async = true;
            script.src = `https://www.googletagmanager.com/gtag/js?id=${bootstrapId}`;
            document.head.appendChild(script);
          }

          if (!googleLibraryConfigured) {
            googleLibraryConfigured = true;
            window.gtag('js', new Date());
          }
        };

        const configureAnalytics = () => {
          ensureGoogleTagLoaded(googleAnalyticsId);
          if (googleAnalyticsConfigured) return;
          googleAnalyticsConfigured = true;
          window.gtag('config', googleAnalyticsId);
        };

        const configureGoogleAds = () => {
          ensureGoogleTagLoaded(googleAdsTagId);
          if (googleAdsConfigured) return;
          googleAdsConfigured = true;
          window.gtag('config', googleAdsTagId);
          window.gtag('config', phoneConversionId, {
            phone_conversion_number: '600227252',
          });
        };

        const configureMetaPixel = () => {
          if (metaPixelConfigured) return;
          metaPixelConfigured = true;

          if (!window.fbq) {
            const fbq = function () {
              if (fbq.callMethod) fbq.callMethod.apply(fbq, arguments);
              else fbq.queue.push(arguments);
            };
            window.fbq = fbq;
            if (!window._fbq) window._fbq = fbq;
            fbq.push = fbq;
            fbq.loaded = true;
            fbq.version = '2.0';
            fbq.queue = [];
          }

          if (!document.getElementById(metaPixelScriptId)) {
            const script = document.createElement('script');
            script.id = metaPixelScriptId;
            script.async = true;
            script.src = 'https://connect.facebook.net/en_US/fbevents.js';
            document.head.appendChild(script);
          }

          window.fbq('init', metaPixelId);
          window.fbq('track', 'PageView');
        };

        window.mpsjSetGoogleConsent = ({ analytics = false, marketing = false } = {}) => {
          window.gtag('consent', 'update', {
            ad_storage: marketing ? 'granted' : 'denied',
            ad_user_data: marketing ? 'granted' : 'denied',
            ad_personalization: marketing ? 'granted' : 'denied',
            analytics_storage: analytics ? 'granted' : 'denied',
          });

          if (analytics) configureAnalytics();
          if (marketing) {
            configureGoogleAds();
            configureMetaPixel();
          }
        };

        try {
          const storedConsent = JSON.parse(window.localStorage.getItem(consentStorageKey) || 'null');
          if (storedConsent?.status === 'accepted') {
            window.mpsjSetGoogleConsent({ analytics: true, marketing: true });
          } else if (storedConsent?.status === 'configured') {
            window.mpsjSetGoogleConsent({
              analytics: storedConsent.analytics === true,
              marketing: storedConsent.marketing === true,
            });
          }
        } catch {
          // Si la preferencia guardada no es válida, se mantiene el consentimiento denegado.
        }
      })();
    </script>
