name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/woodplan-windows-build
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Preparar fuente
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "woodplan-build/woodplan-studio-phase7.zip"
          $chunksDir = Join-Path $env:GITHUB_WORKSPACE "woodplan-build/chunks"
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "woodplan-build/app"
          if (Test-Path $chunksDir) {
            $archive = Join-Path $env:RUNNER_TEMP "woodplan-studio-phase7.zip"
            $output = [System.IO.File]::Create($archive)
            try {
              Get-ChildItem -Path $chunksDir -File | Sort-Object Name | ForEach-Object {
                $input = [System.IO.File]::OpenRead($_.FullName)
                try { $input.CopyTo($output) } finally { $input.Dispose() }
              }
            } finally {
              $output.Dispose()
            }
          }
          if (Test-Path $archive) {
            $appDir = Join-Path $env:RUNNER_TEMP "woodplan-studio"
            Expand-Archive -Path $archive -DestinationPath $appDir -Force
          } elseif (Test-Path $sourceDir) {
            $appDir = $sourceDir
          } else {
            $appDir = $env:GITHUB_WORKSPACE
          }
          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Instalar dependencias
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm ci
      - name: Pruebas y compilación Windows
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm test -- --run
          npm run tauri build -- --bundles nsis
      - name: Publicar ejecutables
        uses: actions/upload-artifact@v4
        with:
          name: woodplan-studio-phase7-windows-x64
          if-no-files-found: error
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/woodplan-studio.exe
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
